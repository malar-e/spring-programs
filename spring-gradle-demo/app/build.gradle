 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
     implementation 'com.google.guava:guava:32.1.3-jre'
    implementation 'org.springframework:spring-context:6.1.11' 
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    implementation 'org.springframework:spring-webmvc:6.1.11'
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.28'
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper:10.1.28'
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'springreqres.AppInitializer'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
